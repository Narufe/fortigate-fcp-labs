# FW1 - System and interface configuration (Section 3)
# FortiGate-VM, FortiOS 7.6
# Trimmed for readability: default/unused interfaces (port6, naf.root, l2t.root,
# ssl.root, fortilink) and snmp-index lines removed.

config system global
    set admintimeout 480
    set hostname "FW1"
    set timezone 65
end

config system interface
    edit "port1"
        set vdom "root"
        set ip 192.168.1.1 255.255.255.0
        set allowaccess ping
        set type physical
        set description "WAN"
        set alias "WAN-1"
        set lldp-reception enable
        set role wan
    next
    edit "port2"
        set vdom "root"
        set ip 192.168.2.1 255.255.255.0
        set allowaccess ping
        set type physical
        set description "WAN"
        set alias "WAN-2"
        set lldp-reception enable
        set role wan
    next
    edit "port3"
        set vdom "root"
        set ip 10.0.1.254 255.255.255.0
        set allowaccess ping
        set type physical
        set alias "LAN"
        set device-identification enable
        set lldp-transmission enable
        set role lan
    next
    edit "port4"
        set vdom "root"
        set allowaccess ping
        set type physical
        set alias "DMZ"
        set role dmz
    next
    edit "port5"
        set vdom "root"
        set ip 192.168.100.200 255.255.255.0
        set allowaccess ping https ssh http
        set type physical
        set alias "MGMT"
    next
end
